name: APK

# Builds the keyboard APK and, for a version tag, publishes it as a GitHub
# release. `rust-core` runs first and fails fast: it compiles and unit-tests the
# Rust engine on the host, which takes a couple of minutes compared with the
# ~20 minutes of a full NDK build.

on:
  push:
    branches: ['arena/250e75f0-rust-keyboard']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Building all four ABIs takes hours; arm64-v8a covers practically every
  # phone this fork is installed on. Add more ABIs here if you need them.
  KB_ABIS: arm64-v8a
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  rust-core:
    name: Rust core (tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-test-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}

      - name: Unit tests
        working-directory: rust
        run: cargo test -p kb-core --all-targets

      - name: Check the JNI crate
        working-directory: rust
        run: cargo check -p kb-jni

  apk:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}

      - name: Build the Rust core
        run: ./rust/build-android.sh

      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-rust.{0}', github.run_number) }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PabiFilter="${KB_ABIS}" \
            -PskipRust \
            assembleStableDebug assembleUnstableDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          find . -path ./rust -prune -o -name "*.apk" -print | while read -r apk; do
            case "$apk" in
              */outputs/apk/*) cp "$apk" "dist/$(basename "$apk")" ;;
            esac
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            Rust-core build of the keyboard (${{ github.ref_name }}).

            * Engine: Rust dictionary/suggestion core (`libkeyboard_core.so`)
              with the C++ voice-input library alongside it.
            * ABI: ${{ env.KB_ABIS }} (arm64 phones). 32-bit/x86 are not included.
            * Signed with the debug keystore that ships in the repository
              (`java/shared.keystore`), so it installs over other builds signed
              with that key; uninstall first if your existing install uses a
              different key.
            * No network permission: see `PRIVACY.md`.
