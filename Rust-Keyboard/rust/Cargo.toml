[workspace]
members = ["core", "jni"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "FUTO Source First License 1.1"
repository = "https://github.com/filkproduct/Rust-Keyboard"

# Size/RAM oriented release profile. The keyboard is a long-lived process, so we
# care more about peak RSS than about raw throughput, but the suggestion engine
# runs on every keystroke, so `opt-level = 3` stays.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.release.package.kb-core]
opt-level = 3

# The JNI bridge is thin glue; size matters more than speed there.
[profile.release.package.kb-jni]
opt-level = "s"
