[package]
name = "kb-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JNI bridge that installs the Rust dictionary/suggestion engine into the keyboard."

[lib]
name = "keyboard_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
kb-core = { path = "../core" }
