plugins {
    id 'com.android.application' version '8.10.1'
    id 'org.jetbrains.kotlin.android' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
    id 'com.android.library' version '8.10.1' apply false
}

def getVersionCode = { ->
    def envCode = System.getenv('VERSION_CODE')
    if (envCode?.trim()) {
        try {
            return Integer.parseInt(envCode.trim())
        } catch (NumberFormatException ignored) {
            project.logger.warn("VERSION_CODE='$envCode' is not a valid integer – falling back to git rev-list.")
        }
    } else {
        project.logger.warn("VERSION_CODE env variable not set – falling back to git rev-list.")
    }

    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--first-parent', '--count', 'master'
            standardOutput = stdout
        }
        return Integer.parseInt(stdout.toString().trim())
    } catch (ignored) {
        project.logger.lifecycle("Failed to get rev-list count from git!")
        return -1
    }
}

def getVersionName = { ->
    def envName = System.getenv('VERSION_NAME')
    if (envName?.trim()) {
        return envName.trim()
    } else {
        project.logger.warn("VERSION_NAME env variable not set – falling back to git describe.")
    }

    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        project.logger.lifecycle("Failed to get version name tag from git!")
        return "0.0.0"
    }
}

def getBranch = { ->
    def envName = System.getenv('BRANCH_NAME')
    if (envName?.trim()) {
        return envName.trim()
    } else {
        project.logger.warn("BRANCH_NAME env variable not set – falling back to git branch.")
    }

    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'branch', '--show-current'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        project.logger.lifecycle("Failed to get branch from git!")
        return "master"
    }
}


final def translationsWithoutEngValues = { final String path ->
    final def sourceDir = file(path)
    final def taskNameSuffix = sourceDir.name.capitalize()

    final def destDir = file("$buildDir/generated/res-translations-filtered/${taskNameSuffix}")

    tasks.register("prepareResFilter${taskNameSuffix}", Copy) {
        from(sourceDir) {
            include 'values-*/**'

            filter { String line ->
                def matcher = line =~ /<string name="([^"]+)"[^>]*>(.+)<\/string>/

                if (matcher.find()) {
                    var stringName = matcher.group(1)
                    var content = matcher.group(2)

                    content = content
                    // Fix duplicate string tags
                            .replaceAll(/<!\[CDATA\[<string [^>]+>(.+)<\\/string>\]\]>/, '$1')
                            .replaceAll(/<string [^>]+>(.+)<\\/string>/, '$1')
                            .replaceAll(/&lt;string [^&]+&gt;(.+)&lt;\\/string&gt;/, '$1')
                    // Remove xliff:g tags entirely, keep only the content
                            .replaceAll(/<xliff:g [^>]+>(.+?)<\/xliff:g>/, '$1')
                            .replaceAll(/&lt;xliff:g [^&]+&gt;(.+?)&lt;\/xliff:g&gt;/, '$1')
                    // Fix escaped quotes
                            .replaceAll(/&amp;quot;/, '"')
                            .replaceAll(/&quot;/, '"')
                            .replaceAll(/\\+/, "\\\\")
                            .replaceAll(/\\"/, '"')
                            .replaceAll(/\\'/, "'")

                    if (content.startsWith("&quot;")) {
                        content = content.substring(6)
                    } else if (content.startsWith('\\"')) {
                        content = content.substring(2)
                    } else if (content.startsWith('"')) {
                        content = content.substring(1)
                    }
                    if (content.endsWith("&quot;")) {
                        content = content.substring(0, content.length() - 6)
                    } else if (content.endsWith('\\"')) {
                        content = content.substring(0, content.length() - 2)
                    } else if (content.endsWith('"')) {
                        content = content.substring(0, content.length() - 1)
                    }

                    content = content.replaceAll('"', '\\\\"')

                    "    <string name=\"" + stringName + "\">\"" + content + "\"</string>\n"
                } else {
                    line
                }
            }
        }
        into(destDir)
        includeEmptyDirs = false

        doFirst {
            if (destDir.exists()) {
                println "Cleaning old contents of $destDir"
                destDir.deleteDir()
            }
        }
    }

    // Ensure it runs before build
    preBuild.dependsOn("prepareResFilter${taskNameSuffix}")

    destDir
}

tasks.register('updateLocales', Exec) {
    workingDir = file('tools/make-keyboard-text-py')
    commandLine = [
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3",
            "src/generate.py"
    ]
}

tasks.register('updateBundleResources', Exec) {
    workingDir = file('java/res-bundle')
    commandLine = [
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3",
            "download-bundles.py",
            file('java/res-bundle').absolutePath
    ]
}

tasks.register('updateContributors') {
    def script = file('tools/contributors.py')
    def outputFile = file('java/src/org/futo/inputmethod/latin/uix/settings/pages/credits/Contributors.kt')

    inputs.file script
    outputs.file outputFile

    doLast {
        exec {
            environment 'GITHUB_TOKEN', System.getenv('GITHUB_TOKEN') ?: ''
            commandLine 'python3', script.absolutePath
        }
    }
}

preBuild.dependsOn updateLocales

android {
    namespace 'org.futo.inputmethod.latin'

    compileSdk 35

    // Required if using classes in android.test.runner
    useLibrary 'android.test.runner'

    // Required if using classes in android.test.base
    useLibrary 'android.test.base'

    // Required if using classes in android.test.mock
    useLibrary 'android.test.mock'

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionName getVersionName()
        versionCode getVersionCode()

        applicationId 'org.futo.inputmethod.latin'
        testApplicationId 'org.futo.inputmethod.latin.tests'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = false
        // Only English resources ship: AppCompat, Material and Compose each
        // carry ~80 locales of their own resources.
        // English only. Density buckets are deliberately not filtered: a drawable
        // that exists in a single bucket would disappear with it.
        resourceConfigurations += ["en"]

        // One ABI. Every Android phone this keyboard runs on is arm64, and the
        // native engine used to be built for four architectures.
        final def abiFilter = project.findProperty('abiFilter') ?: 'arm64-v8a'
        final def abis = abiFilter.toString().split(',').collect { it.trim() }.findAll { it }
        ndk {
            abiFilters.addAll(abis)
        }
        project.logger.lifecycle("Restricting native ABIs to ${abis}")
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    signingConfigs {
        debug {
            storeFile file("java/shared.keystore")
        }
    }

    final def keystorePropertiesFile = rootProject.file("keystore.properties")
    def releaseSigning = signingConfigs.debug
    if (keystorePropertiesFile.exists()) {
        final def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        releaseSigning = signingConfigs.create("release") {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    } else {
        project.logger.lifecycle('keystore.properties not found, APK may not be signed')
    }


    final def crashReportPropertiesFile = rootProject.file("crashreporting.properties")
    final def crashReportProperties = new Properties()
    if (crashReportPropertiesFile.exists()) {
        crashReportProperties.load(new FileInputStream(crashReportPropertiesFile))
    } else {
        project.logger.lifecycle('crashreporting.properties not found, crash reporting will be disabled')
    }


    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigning
        }

        buildTypes.each {
            if (crashReportPropertiesFile.exists()) {
                it.buildConfigField "boolean", "ENABLE_ACRA", crashReportProperties['acraEnabled']
                it.buildConfigField "String", "ACRA_URL", crashReportProperties['acraUrl']
                it.buildConfigField "String", "ACRA_USER", crashReportProperties['acraUser']
                it.buildConfigField "String", "ACRA_PASSWORD", crashReportProperties['acraPassword']
            } else {
                it.buildConfigField "boolean", "ENABLE_ACRA", "false"
                it.buildConfigField "String", "ACRA_URL", "\"\""
                it.buildConfigField "String", "ACRA_USER", "\"\""
                it.buildConfigField "String", "ACRA_PASSWORD", "\"\""
            }

            //it.buildConfigField "String", "FUTOPAY_URL", "\"https://pay.futo.org/api/PaymentPortal?product=voiceinput&success=futo-keyboard%3a%2f%2flicense%2factivate\""
            it.buildConfigField "String", "FUTOPAY_URL", "\"https://pay2.futo.org/checkout/polar/futo-keyboard/futo-keyboard-voiceinput/checkout-ready?success=redirect-to-organization-page\""
            it.buildConfigField "String", "FUTOPAY_PRICE", "\"~\$6.99\""

            it.buildConfigField "String", "GOOGLEPAY_URL", "\"https://play.google.com/store/apps/details?id=org.futo.keyboardpayment\""
            it.buildConfigField "String", "GOOGLEPAY_PRICE", "\"~\$11.99\""
        }
    }

    flavorDimensions = ["buildType"]

    productFlavors {
        unstable {
            dimension "buildType"
            applicationIdSuffix ".unstable"
            versionNameSuffix "-unstable"

            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            buildConfigField "boolean", "UPDATE_CHECKING", "true"
            buildConfigField "boolean", "UPDATE_CHECKING_NETWORK", "false"
            buildConfigField "String", "BRANCH", "\"${getBranch()}\""
            getIsDefault().set(true)

            buildConfigField "String", "PAYMENT_PRICE", "FUTOPAY_PRICE"
        }

        stable {
            dimension "buildType"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            buildConfigField "boolean", "UPDATE_CHECKING", "true"
            buildConfigField "boolean", "UPDATE_CHECKING_NETWORK", "false"
            buildConfigField "String", "BRANCH", "\"${getBranch()}\""

            buildConfigField "String", "PAYMENT_PRICE", "FUTOPAY_PRICE"
        }

        playstore {
            dimension "buildType"
            applicationIdSuffix ".playstore"
            versionNameSuffix "-playstore"

            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "true"
            buildConfigField "boolean", "UPDATE_CHECKING", "false"
            buildConfigField "boolean", "UPDATE_CHECKING_NETWORK", "false"
            buildConfigField "String", "BRANCH", "\"${getBranch()}\""

            buildConfigField "String", "PAYMENT_PRICE", "GOOGLEPAY_PRICE"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // English only: the translated string sets are not merged in.
            res.srcDirs = [
                    'java/res',
                    'java/res-large'
            ]
            java.srcDirs = ['common/src', 'java/src']
            manifest.srcFile 'java/AndroidManifest.xml'
            assets.srcDirs = ['java/assets']
            // Produced by rust/build-android.sh (libkeyboard_core.so).
            jniLibs.srcDirs = ['java/jniLibs']
        }

        playstore {
            java.srcDirs = ['common/src', 'java/src', 'java/playstore/java']
            res.srcDirs = ['java/res-bundle']
            manifest.srcFile 'java/playstore/AndroidManifest.xml'
        }

        stable {
            java.srcDirs = ['common/src', 'java/src', 'java/stable/java']
            manifest.srcFile 'java/stable/AndroidManifest.xml'
        }

        unstable {
            java.srcDirs = ['common/src', 'java/src', 'java/stable/java']
            manifest.srcFile 'java/stable/AndroidManifest.xml'
            res.srcDirs = ['java/unstable/res']
        }

        androidTest {
            res.srcDirs = ['tests/res']
            java.srcDirs = ['tests/src']
            manifest.srcFile 'tests/AndroidManifest.xml'
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    aaptOptions {
        noCompress 'dict'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/**', 'kotlin/**', 'DebugProbesKt.bin', '**/*.kotlin_builtins']
        }
        jniLibs {
            // Keep the libraries compressed inside the APK: extracting them on
            // install stored a second copy on the device.
            useLegacyPackaging false
        }
    }

    // The C++ engine is gone: the Rust core registers every native the app uses
    // (dictionary, proximity info, traverse session), so building llama.cpp,
    // whisper.cpp, sentencepiece and protobuf-lite here only cost package size
    // and build time. `native/` stays in the tree for reference.

    // Builds the Rust core (rust/) and copies libkeyboard_core.so into
    // java/jniLibs. The script is a no-op when no Rust toolchain is installed,
    // so plain `./gradlew assembleDebug` keeps working without Rust.
    // Pass -PskipRust to skip it explicitly.
    def rustBuildScript = file('rust/build-android.sh')
    tasks.register('rustNativeBuild', Exec) {
        onlyIf { rustBuildScript.exists() && !project.hasProperty('skipRust') }
        workingDir project.rootDir
        commandLine 'sh', rustBuildScript.absolutePath
        doLast {
            logger.lifecycle('Rust core: java/jniLibs populated (if a toolchain was available)')
        }
    }
    tasks.named('preBuild').configure { dependsOn 'rustNativeBuild' }

    // English only, small package: drop what the shared submodules carry for
    // features this build does not have. This runs inside Gradle, right before
    // packaging, so it cannot be skipped by a stale checkout.
    tasks.register('stripUnusedResources') {
        doLast {
            // The transformer language model: a multilingual model (it predicted
            // words in other languages) worth ~30 MB of package and hundreds of
            // megabytes of RAM.
            fileTree(dir: 'java/res-large/raw', include: ['*.gguf', 'ml4_*']).each { it.delete() }
            // Swipe decoding: three TFLite models nothing reads any more.
            file('java/assets/futo-swipe').listFiles()?.each { it.delete() }

            // Keyboard layouts ship for every script upstream supports (~900 KB,
            // plus 230 KB of git metadata that would be packaged as assets). An
            // English build can only reach the Default and Special sets plus the
            // handful of layouts that mapping.yaml lists for en, en_GB, en_IN and
            // en_Shaw; everything else is unreachable. safeGetLayout() turns a
            // missing layout into a bug report instead of a crash, so a stale
            // preference cannot take the keyboard down.
            final def layoutRoot = file('java/assets/layouts')
            if (layoutRoot.isDirectory()) {
                final def keepRootFiles = ['mapping.yaml', 'names.yaml', 'LICENSE'] as Set
                final def keepDirectories = ['Default', 'Special'] as Set
                final def keepNested = [
                        'LatinScript/French/bepo.yaml',
                        'ConstructedScripts/shavian.yaml',
                        'ConstructedScripts/shavian_two_layer.yaml',
                ] as Set
                long layoutBytes = 0
                layoutRoot.eachFileRecurse { candidate ->
                    if (candidate.isFile()) { layoutBytes += candidate.length() }
                }
                layoutRoot.eachFileRecurse { candidate ->
                    if (!candidate.isFile()) { return }
                    final def relative = layoutRoot.toPath()
                            .relativize(candidate.toPath()).toString().replace('\\', '/')
                    final boolean keep = keepNested.contains(relative) ||
                            (relative.contains('/') && keepDirectories.contains(relative.split('/')[0])) ||
                            (!relative.contains('/') && keepRootFiles.contains(relative))
                    if (!keep) { candidate.delete() }
                }
                final def directories = []
                layoutRoot.eachDirRecurse { directories.add(it) }
                directories.sort { -it.path.length() }.each { directory ->
                    if ((directory.listFiles()?.length ?: 0) == 0) { directory.delete() }
                }
                long keptBytes = 0
                layoutRoot.eachFileRecurse { candidate ->
                    if (candidate.isFile()) { keptBytes += candidate.length() }
                }
                logger.lifecycle("layouts trimmed from ${layoutBytes / 1024} KB to ${keptBytes / 1024} KB")
            }

            // Bitmaps ship in five density buckets (~1.2 MB) but the keyboard
            // draws every one of them at the same logical size. Keep a single
            // copy per resource name, preferring xxhdpi: Android scales whatever
            // is present, and one bucket is both smaller in the package and
            // cheaper to decode at runtime. Resources that only exist in one
            // bucket - most of them - are left untouched.
            final def densityBuckets = [
                    ['drawable-xxhdpi', 'drawable-xxxhdpi', 'drawable-xhdpi',
                     'drawable-hdpi', 'drawable-mdpi', 'drawable'],
                    ['mipmap-xxhdpi', 'mipmap-xxxhdpi', 'mipmap-xhdpi',
                     'mipmap-hdpi', 'mipmap-mdpi'],
            ]
            final def resRoot = file('java/res')
            if (resRoot.isDirectory()) {
                long droppedBitmapBytes = 0
                densityBuckets.each { buckets ->
                    final Map<String, File> preferred = [:]
                    buckets.each { bucket ->
                        final def bucketDir = new File(resRoot, bucket)
                        if (!bucketDir.isDirectory()) { return }
                        bucketDir.listFiles()?.each { entry ->
                            if (!entry.isFile()) { return }
                            final def existing = preferred.get(entry.name)
                            if (existing == null) {
                                preferred.put(entry.name, entry)
                            } else {
                                droppedBitmapBytes += entry.length()
                                entry.delete()
                            }
                        }
                    }
                }
                if (droppedBitmapBytes > 0) {
                    logger.lifecycle("density buckets: dropped ${droppedBitmapBytes / 1024} KB of duplicate bitmaps")
                }
            }

            // The same goes for the spacing/punctuation tables: one file per
            // language, but an English build only ever reaches "default" and
            // "default-sw600dp"; a missing candidate is caught as IOException and
            // the default table is always the last fallback.
            file('java/assets/spacing-and-punctuations').listFiles()?.each { entry ->
                if (entry.isFile() && !entry.name.startsWith('default')) { entry.delete() }
            }

            // Emoji descriptions ship for every language the upstream build
            // supports (~5 MB gzipped). Keep the English section only: the file
            // is a sequence of "#<language>" marker lines, each followed by one
            // line of JSON.
            final def emojiI18n = file('java/res-large/raw/emoji_i18n.jsondlgz')
            if (emojiI18n.isFile()) {
                final def lines = new java.util.zip.GZIPInputStream(
                        new java.io.FileInputStream(emojiI18n)).getText('UTF-8').readLines()
                final def kept = []
                int index = 0
                while (index < lines.size()) {
                    final def line = lines[index]
                    if (line.startsWith('#')) {
                        final def language = line.substring(1).trim()
                        final def payload = (index + 1 < lines.size()) ? lines[index + 1] : ''
                        if (language == 'en' || language.startsWith('en_')) {
                            kept.add(line)
                            kept.add(payload)
                        }
                        index += 2
                    } else {
                        index += 1
                    }
                }
                if (!kept.isEmpty()) {
                    final def sink = new java.util.zip.GZIPOutputStream(
                            new java.io.FileOutputStream(emojiI18n))
                    sink.write((kept.join('\n') + '\n').getBytes('UTF-8'))
                    sink.close()
                    logger.lifecycle("emoji_i18n trimmed to ${kept.size() / 2} language(s)")
                }
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn 'stripUnusedResources' }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    dependenciesInfo {
        // The build id is only used by Play; it is dead weight in a sideloaded APK.
        includeInApk = false
    }
    buildFeatures {
        compose true
        viewBinding true
        mlModelBinding false
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            // Keep the libraries compressed inside the APK: extracting them on
            // install stored a second copy on the device.
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.navigation:navigation-compose:2.10.0-alpha02'

    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.autofill:autofill:1.1.0'
    implementation 'androidx.window:window:1.3.0'


    implementation 'sh.calvin.reorderable:reorderable:3.0.0'

    //implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.7.1'

    implementation 'com.akuleshov7:ktoml-core:0.7.1'

    //def work_version = "2.9.0"
    //implementation "androidx.work:work-runtime-ktx:$work_version"
    //implementation "androidx.work:work-runtime:$work_version"

    implementation "com.charleskorn.kaml:kaml:0.61.0"

    // The Japanese (mozc) and Chinese (Rime) engines were removed: this build is
    // English only, and their dictionaries were most of the package size. The
    // swipe decoder library is gone too: swipe typing is not part of this build,
    // and it was the only thing pulling in its JNI and libc++.

    // No crash reporter: ACRA (mail and dialog) used to ship here, but crash
    // reporting needs crashreporting.properties, which this fork never has.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.3")

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation "org.mockito:mockito-core:1.9.5"
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    androidTestImplementation 'androidx.annotation:annotation:1.0.0'
}

